
media: images
content:
  - name: vacancies
    label: Job vacancies
    type: collection
    path: data/jobs
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, location, sector, published]
      search: [title, location, sector]
    fields:
      - name: id
        label: Job ID
        type: string
        required: true
      - name: title
        label: Job title
        type: string
        required: true
      - name: published
        label: Show on website
        type: boolean
      - name: location
        label: Location
        type: string
        required: true
      - name: type
        label: Employment type
        type: string
      - name: sector
        label: Sector
        type: select
        required: true
        options:
          values:
            - Engineering & Technical
            - Construction & Trades
            - Professional Services
            - Technology
      - name: salary
        label: Salary
        type: string
      - name: summary
        label: Short description
        type: text
        required: true
      - name: intro
        label: Introductory paragraph
        type: text
      - name: description
        label: About the role
        type: text
        required: true
      - name: workLocation
        label: Work arrangement
        type: string
      - name: sections
        label: Job description sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: items
            label: Bullet points
            type: string
            list: true
