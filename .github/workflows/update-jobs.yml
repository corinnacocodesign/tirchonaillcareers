name: Update job listings

on:
  push:
    branches:
      - root
    paths:
      - 'data/jobs/**'
      - 'scripts/build_jobs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-job-listings
  cancel-in-progress: false

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Get website files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild job listings
        run: python3 scripts/build_jobs.py

      - name: Save updated listings
        run: |
          if ! git diff --quiet -- data/jobs-index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs-index.json
            git commit -m "Update published job listings"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin root
              if git push origin HEAD:root; then
                exit 0
              fi
              sleep 3
            done
            echo 'Unable to push updated job listings after retries' >&2
            exit 1
          fi
